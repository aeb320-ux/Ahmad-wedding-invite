<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f0e6">
<meta name="description" content="دعوة زفاف أحمد وشذى - 29 سبتمبر 2026">
<title>دعوة زفاف • أحمد & شذى</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,"Arial",sans-serif;background:#eee5d8;color:#2b241e}body{overflow-x:hidden}
.page{min-height:100vh;display:flex;justify-content:center;padding:18px 10px 40px;position:relative;overflow:hidden}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.9),transparent 38%),radial-gradient(circle at 10% 90%,rgba(187,135,58,.13),transparent 30%)}
.card{width:min(620px,100%);position:relative;z-index:2;background:#f8f1e7;border:1px solid rgba(145,102,45,.28);border-radius:22px;box-shadow:0 25px 70px rgba(60,42,20,.22);overflow:hidden}
.cover{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:38px 22px;position:relative;background:linear-gradient(145deg,#fbf7ef,#eee2d1)}
.cover:before{content:"";position:absolute;inset:14px;border:1px solid rgba(150,106,45,.35);border-radius:18px;pointer-events:none}
.orn{font-size:42px;color:#a77835;letter-spacing:5px;margin-bottom:18px}.small{font-size:15px;letter-spacing:1px;color:#80613b}.names{font-family:Georgia,serif;font-size:42px;color:#9a6c2e;margin:14px 0}.amp{font-size:25px;color:#b28a52}.hint{margin-top:26px;font-size:14px;color:#6e6255}.open{margin-top:18px;border:1px solid #a87937;background:#fffaf2;color:#7d5929;border-radius:999px;padding:14px 30px;font-size:16px;box-shadow:0 8px 24px rgba(120,80,30,.14);cursor:pointer;transition:.25s}.open:active{transform:scale(.97)}
.invite{display:none;background:#f8f1e7}.invite.show{display:block;animation:rise .7s ease}.hero{width:100%;display:block}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px}.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;border:1px solid rgba(151,107,48,.35);background:#fffaf2;color:#6f4e24;border-radius:14px;text-decoration:none;font-size:15px;box-shadow:0 5px 16px rgba(80,55,25,.08);cursor:pointer}.btn.full{grid-column:1/-1}.count{margin:4px 16px 18px;padding:16px;border-radius:16px;background:rgba(166,123,62,.08);text-align:center}.count h3{margin:0 0 10px;font-size:16px;font-weight:500;color:#765328}.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;direction:ltr}.unit{background:#fffaf4;border:1px solid rgba(151,107,48,.2);border-radius:12px;padding:9px 3px}.num{font-size:24px;color:#9b6b2c;font-weight:700}.lab{font-size:11px;color:#806b53;margin-top:3px}.footer{text-align:center;padding:10px 22px 30px;color:#75695c;font-size:14px;line-height:1.9}.footer strong{color:#96682c}
.music-modal{display:none;position:fixed;inset:0;z-index:30;background:rgba(35,25,16,.72);align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(5px)}
.music-modal.show{display:flex;animation:fadeIn .25s ease}.music-box{width:min(520px,100%);background:#f8f1e7;border:1px solid rgba(151,107,48,.4);border-radius:20px;padding:18px;position:relative;box-shadow:0 25px 70px rgba(0,0,0,.35);text-align:center}.music-title{color:#805b2c;font-size:18px;margin:4px 0 14px}.music-box p{line-height:1.8;color:#665a4e;font-size:14px}.close-music{position:absolute;right:10px;top:7px;width:34px;height:34px;border:0;border-radius:50%;background:#fffaf2;color:#6f4e24;font-size:26px;line-height:1;cursor:pointer;z-index:2}
.heart,.petal{position:fixed;z-index:10;pointer-events:none;animation:fall linear forwards;top:-50px}.heart{font-size:22px}.petal{font-size:18px}.spark{position:fixed;width:5px;height:5px;background:#b78a4b;border-radius:50%;pointer-events:none;z-index:10;animation:spark .9s ease-out forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(var(--r));opacity:0}}@keyframes spark{to{transform:translate(var(--sx),var(--sy)) scale(.2);opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(max-width:420px){.names{font-size:34px}.actions{padding:12px;gap:8px}.btn{font-size:14px}.num{font-size:20px}}
</style>
</head>
<body>
<div class="glow"></div>
<main class="page"><section class="card">
<div id="cover" class="cover">
  <div class="orn">❦ ✦ ❦</div>
  <div class="small">بِسْمِ اللهِ وَعَلَى بَرَكَةِ الله</div>
  <div class="names">أحمد <span class="amp">&</span> شذى</div>
  <div class="small">يسعدنا أن نشارككم أجمل لحظاتنا</div>
  <button class="open" onclick="openInvite(event)">🤍 اضغط لفتح الدعوة</button>
  <div class="hint">ستظهر مفاجأة صغيرة عند فتحها ✨</div>
</div>

<div id="invite" class="invite">
  <img class="hero" src="invitation.jpg" alt="بطاقة دعوة زفاف أحمد وشذى">
  <div class="actions">
    <a class="btn" href="https://maps.app.goo.gl/pW1QQvwpiygftcNfA" target="_blank" rel="noopener">📍 موقع الحفل</a>
    <button class="btn" onclick="addCalendar()">📅 أضف الموعد</button>
    <button id="soundBtn" class="btn full" onclick="toggleCelebrationSound()">🔊 إيقاف صوت الأفراح</button>
    <button id="voiceBtn" class="btn full" onclick="welcomeVoice()">🗣️ صوت ترحيبي</button>
  </div>

  <div class="count">
    <h3>باقي على فرحتنا 🤍</h3>
    <div class="timer">
      <div class="unit"><div class="num" id="d">--</div><div class="lab">يوم</div></div>
      <div class="unit"><div class="num" id="h">--</div><div class="lab">ساعة</div></div>
      <div class="unit"><div class="num" id="m">--</div><div class="lab">دقيقة</div></div>
      <div class="unit"><div class="num" id="s">--</div><div class="lab">ثانية</div></div>
    </div>
  </div>

  <div class="footer">
    حضوركم يشرّفنا ويزيد فرحتنا<br>
    <strong>ننتظركم لنحتفل معاً ❤️</strong><br><br>
    الجويدة - شارع مأدبا - مجمع أبو خضرة التجاري
  </div>
</div>
</section></main>

<audio id="celebrationAudio" src="celebration_ambience.wav" preload="auto"></audio>

<script>
const target=new Date('2026-09-29T20:30:00+03:00').getTime();
function tick(){
  let x=Math.max(0,target-Date.now());
  let d=Math.floor(x/86400000);x%=86400000;
  let h=Math.floor(x/3600000);x%=3600000;
  let m=Math.floor(x/60000);let s=Math.floor((x%60000)/1000);
  document.getElementById('d').textContent=d;
  document.getElementById('h').textContent=String(h).padStart(2,'0');
  document.getElementById('m').textContent=String(m).padStart(2,'0');
  document.getElementById('s').textContent=String(s).padStart(2,'0');
}
setInterval(tick,1000);tick();

const audio=document.getElementById('celebrationAudio');
function openInvite(e){
  document.getElementById('cover').style.display='none';
  document.getElementById('invite').classList.add('show');
  burst(e.clientX,e.clientY);fall();
  audio.volume=.48;
  audio.currentTime=0;
  audio.play().catch(()=>{});
  setTimeout(()=>welcomeVoice(),900);
}
function burst(cx,cy){
  for(let i=0;i<24;i++){
    let el=document.createElement('div');el.className='spark';
    el.style.left=cx+'px';el.style.top=cy+'px';
    el.style.setProperty('--sx',(Math.random()*280-140)+'px');
    el.style.setProperty('--sy',(Math.random()*230-155)+'px');
    document.body.appendChild(el);setTimeout(()=>el.remove(),1000)
  }
}
function fall(){
  let icons=['❤️','🤍','🌸','✨','🌹'];
  for(let i=0;i<38;i++){
    let el=document.createElement('div');
    el.className=Math.random()>.55?'heart':'petal';
    el.textContent=icons[Math.floor(Math.random()*icons.length)];
    el.style.left=Math.random()*100+'vw';
    el.style.setProperty('--x',(Math.random()*260-130)+'px');
    el.style.setProperty('--r',(Math.random()*900-450)+'deg');
    el.style.animationDuration=(4+Math.random()*5)+'s';
    el.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(el);setTimeout(()=>el.remove(),11000)
  }
}
document.addEventListener('click',e=>{
  if(document.getElementById('invite').classList.contains('show') && e.target.tagName!=='BUTTON' && e.target.tagName!=='A')
    burst(e.clientX,e.clientY)
});

function toggleCelebrationSound(){
  const btn=document.getElementById('soundBtn');
  if(audio.paused){
    audio.play().catch(()=>{});
    btn.textContent='🔊 إيقاف صوت الأفراح';
  }else{
    audio.pause();
    btn.textContent='🔈 تشغيل صوت الأفراح';
  }
}
function welcomeVoice(){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance('أهلاً وسهلاً بكم، ونوّرتونا، وحضوركم يسعدنا ويزيد فرحتنا. ننتظركم في حفل زفاف أحمد وشذى.');
  u.lang='ar-JO'; u.rate=.9; u.pitch=1.05; u.volume=1;
  const voices=speechSynthesis.getVoices();
  const ar=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('ar'));
  if(ar) u.voice=ar;
  speechSynthesis.speak(u);
}

function addCalendar(){
  const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Wedding Invite//AR\r\nBEGIN:VEVENT\r\nDTSTART:20260929T203000\r\nDTEND:20260929T233000\r\nSUMMARY:حفل زفاف أحمد وشذى\r\nLOCATION:الجويدة - شارع مأدبا - مجمع أبو خضرة التجاري\r\nDESCRIPTION:حفل زفاف أحمد وشذى\r\nEND:VEVENT\r\nEND:VCALENDAR`;
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='wedding-ahmad-shatha.ics';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
</script>
</body>
</html>
